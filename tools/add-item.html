<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add to the wishlist</title>
<link rel="stylesheet" href="/wishlist.css">
<link rel="stylesheet" href="/editor.css">
<script src="/editor.js" defer></script>
</head>
<body>
<main class="editor">
  <header>
    <h1>Add to the wishlist</h1>
    <p>Paste a product link, then check the details before you save.</p>
  </header>
  <form id="lookup">
    <label>Product link <input name="url" type="url" required placeholder="https://shop.example/product" autocomplete="off"></label>
    <button type="submit">Look up product</button>
  </form>
  <p id="lookup-status" role="status"></p>
  <form id="review" hidden>
    <h2>Review the item</h2>
    <div class="review-grid">
      <div class="fields">
        <label>Name <input name="title" required maxlength="280"></label>
        <div class="pair">
          <label>Category <input name="category" required list="categories" maxlength="80"></label>
          <datalist id="categories"></datalist>
          <label>Price in pounds <input name="price" type="number" min="0" max="9999999" step="0.01" placeholder="Optional" inputmode="decimal"></label>
        </div>
        <label>Product link <input name="url" type="url" required></label>
        <label>Size, colour or variant <input name="variant" maxlength="180"></label>
        <label>Notes <textarea name="notes" rows="2" maxlength="1000"></textarea></label>
        <label class="checkbox"><input name="suggest" type="checkbox" checked> Include in gift suggestions when it has a price</label>
      </div>
      <div class="photo">
        <div class="photo-preview">
          <p id="no-photo">No photo selected</p>
          <img alt="Product photo to review" id="preview" hidden>
        </div>
        <label>Photo link <input name="photoUrl" type="url" placeholder="https://…" autocomplete="off"></label>
        <div class="photo-actions">
          <button type="button" id="preview-link">Preview photo</button>
          <button type="button" id="remove-photo">Remove photo</button>
        </div>
        <label>Or choose a photo file <input name="photoFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif"></label>
        <p id="photo-status" role="status"></p>
      </div>
    </div>
    <div class="save">
      <button type="submit">Save item locally</button>
      <p id="save-status" role="status"></p>
    </div>
  </form>
</main>
</body>
</html>
